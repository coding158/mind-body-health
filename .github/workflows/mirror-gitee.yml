name: Gitee Bidirectional Mirror

on:
  push:
    branches: [main]
  schedule:
    # 每 15 分钟执行一次（GitHub Actions 最小时钟频率）
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: gitee-mirror-sync
      cancel-in-progress: false
    steps:
      - name: Checkout GitHub main (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "code sk"
          git config user.email "coding1580779@gmail.com"

      - name: Add Gitee remote (token from secret, never logged)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/coding158/mind-body-health.git"

      - name: Fetch latest from both sides
        run: |
          git fetch origin main
          git fetch gitee main || echo "GITEE_FETCH_FAILED"

      - name: Write back Gitee commits to GitHub (GitHub = SSOT, conflict → GitHub wins)
        run: |
          set -euo pipefail
          # 计算两侧领先的提交数
          GITEE_AHEAD=$(git rev-list --count origin/main..gitee/main 2>/dev/null || echo 0)
          ORIGIN_AHEAD=$(git rev-list --count gitee/main..origin/main 2>/dev/null || echo 0)
          echo "gitee_ahead=${GITEE_AHEAD} origin_ahead=${ORIGIN_AHEAD}"

          if [ "${GITEE_AHEAD}" -gt 0 ]; then
            echo "==> Gitee has ${GITEE_AHEAD} unique commit(s), merging them back to GitHub"
            # 把 Gitee 的提交 rebase 到 GitHub 最新之上（GitHub 为主源）
            git checkout -B mirror-sync gitee/main
            if git rebase origin/main; then
              git push origin mirror-sync:main
              echo "WRITE_BACK_OK"
            else
              echo "==> REBASE CONFLICT: GitHub wins (SSOT)"
              git rebase --abort
              # 保留 Gitee 独有提交到备份分支，避免数据丢失
              BACKUP_BRANCH="gitee-conflict-backup-$(date +%Y%m%d-%H%M%S)"
              git branch "${BACKUP_BRANCH}" gitee/main
              git push gitee "${BACKUP_BRANCH}" || echo "BACKUP_PUSH_FAILED"
              echo "CONFLICT_RESOLVED_GITHUB_WINS backup=${BACKUP_BRANCH}"
            fi
          else
            echo "==> No unique commits on Gitee, nothing to write back"
          fi
        shell: bash

      - name: Push GitHub main to Gitee (mirror down)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          git checkout main 2>/dev/null || git checkout -B main origin/main
          # 若 Gitee 落后则 fast-forward；若已分叉（Gitee 独有提交已回流/备份）则 force-with-lease
          if git rev-parse --verify gitee/main >/dev/null 2>&1; then
            if git merge-base --is-ancestor gitee/main origin/main; then
              git push gitee main:main
            else
              echo "==> Gitee diverged, force-with-lease push (backup branch already kept)"
              git push --force-with-lease gitee main:main
            fi
          else
            git push gitee main:main
          fi
        shell: bash

      - name: Verify parity
        run: |
          git fetch origin main
          git fetch gitee main
          A=$(git rev-parse origin/main)
          B=$(git rev-parse gitee/main)
          echo "github_main=${A}"
          echo "gitee_main=${B}"
          if [ "${A}" = "${B}" ]; then
            echo "PARITY_OK"
          else
            echo "PARITY_DIFF (expected if Gitee unique commits were kept in backup branch)"
          fi
        shell: bash
